# .github/workflows/backtest.yml
#
# Runs the Swing STRUCTURE (SMC) backtest on demand or on a schedule.
# Upload a 1-minute OHLC CSV as an artifact or place Histdata-style files
# in a data/ folder; otherwise the job will fail with a clear message.
#
# Trigger:
#   - Manual (workflow_dispatch) – recommended
#   - Optional weekly schedule (commented out)
#
# Outputs (uploaded as artifacts):
#   - backtest_trades.csv
#   - backtest_equity.png
#   - backtest_summary.txt

name: Backtest Swing SMC

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2024-01-01"
      end_date:
        description: "End date (YYYY-MM-DD) – leave empty for latest"
        required: false
        default: ""
      pair:
        description: "Pair (reporting only)"
        required: false
        default: "XAU/USD"
  # Uncomment to run automatically every Sunday at 02:00 UTC
  # schedule:
  #   - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib

      - name: Run backtest
        env:
          START_DATE: ${{ github.event.inputs.start_date || '2024-01-01' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          PAIR: ${{ github.event.inputs.pair || 'XAU/USD' }}
        run: |
          set -e
          ARGS="--pair \"$PAIR\" --start \"$START_DATE\" --out backtest_results"
          if [ -n "$END_DATE" ]; then
            ARGS="$ARGS --end \"$END_DATE\""
          fi
          # Prefer a data file if the user uploaded one or keeps it in the repo
          if [ -f data/xauusd_1m.csv ]; then
            ARGS="$ARGS --data data/xauusd_1m.csv"
          elif [ -f data/XAUUSD_M1.csv ]; then
            ARGS="$ARGS --data data/XAUUSD_M1.csv"
          fi
          echo "Running: python backtest.py $ARGS"
          eval python backtest.py $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: |
            backtest_results/backtest_trades.csv
            backtest_results/backtest_equity.png
            backtest_results/backtest_summary.txt
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          if [ -f backtest_results/backtest_summary.txt ]; then
            cat backtest_results/backtest_summary.txt
          else
            echo "No summary file produced."
          fi
