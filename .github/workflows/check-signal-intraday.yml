name: Check forex signal (Intraday)

on:
  workflow_dispatch: {}
  # Triggered externally via cron-job.org calling the GitHub API
  # (workflow_dispatch), not GitHub's native schedule — see setup notes.

concurrency:
  group: forex-signal-intraday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install metaapi-cloud-sdk matplotlib requests

      - name: Run intraday signal check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRATEGY_LABEL: "INTRADAY"
          STATE_FILENAME: "state_intraday.json"
          FX_PAIRS: "XAU/USD"
          TF_TREND: "4h"
          TF_STRUCTURE: "15min"
          TF_ENTRY: "5min"
          TREND_CACHE_MINUTES: "230"
          STRUCTURE_CACHE_MINUTES: "12"  # under the 15min bar so a fresh fetch happens every bar
          SWING_LOOKBACK: "2"
          SL_BUFFER_ATR_MULT: "0.15"
          ENTRY_MODE: "retest_or_pullback"  # breakout+retest OR pullback — either confirms
          RETEST_TOLERANCE_ATR_MULT: "0.25"
          SWING_ENTRY_MODE: "true"          # pullback fallback now requires 50-79% retracement before confirming
          TP_MULTIPLES: "1,2,3,4,5"
          DAY_MAX_HOLD_HOURS: "24"
          DAY_SWING_MAX_HOLD_HOURS: "72"
          SWING_MAX_HOLD_HOURS: "240"
          AUTO_TRADE_ENABLED: "false"
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          TRADE_LOT_SIZE: "0.01"
          MAX_CONCURRENT_TRADES: "1"
          BROKER_SYMBOL_SUFFIX: "m"
        run: python forex_alert.py

      - name: Commit updated state
        run: |
          git config user.name "forex-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_intraday.json

          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update intraday signal state [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done
