name: Check forex signal (Swing)

on:
  schedule:
    # Every 5 minutes. Only viable on the free tier because forex_alert.py
    # caches the 4H/1H fetches — only the 5M candle is fetched every run.
    # FX_PAIRS is a single pair for the same reason: the combined daily
    # budget across both workflows is the binding constraint.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install metaapi-cloud-sdk

      - name: Run swing signal check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRATEGY_LABEL: "SWING"
          STATE_FILENAME: "state_swing.json"
          FX_PAIRS: "EUR/USD"
          TF_TREND: "4h"
          TF_STRUCTURE: "1h"            # SMC style uses 1H for structure/order-block, not 15M
          TF_ENTRY: "5min"
          TREND_CACHE_MINUTES: "230"
          STRUCTURE_CACHE_MINUTES: "50"  # under the 1h bar so a fresh fetch happens every bar
          SWING_LOOKBACK: "2"
          SL_BUFFER_ATR_MULT: "0.15"
          ENTRY_MODE: "structure"       # SMC: 1H order block + 5M engulfing/rejection, session-filtered
          OB_LOOKBACK: "15"
          REJECTION_WICK_RATIO: "0.5"
          SESSION_START_UTC: "7"        # London/NY combined window
          SESSION_END_UTC: "21"
          TP_MULTIPLES: "1,2,3,4,5"
          AUTO_TRADE_ENABLED: "false"
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          TRADE_LOT_SIZE: "0.01"
          MAX_CONCURRENT_TRADES: "1"
          BROKER_SYMBOL_SUFFIX: "m"
        run: python forex_alert.py

      - name: Commit updated state
        run: |
          git config user.name "forex-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_swing.json
          git diff --quiet --cached || git commit -m "Update swing signal state [skip ci]"
          git pull --rebase && git push
bt
