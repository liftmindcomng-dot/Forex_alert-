name: Check forex signal (Swing)
on:
  workflow_dispatch: {}
  # Triggered externally via cron-job.org calling the GitHub API
  # (workflow_dispatch), not GitHub's native schedule — see setup notes.
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install metaapi-cloud-sdk matplotlib requests
      - name: Run swing signal check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRATEGY_LABEL: "SWING"
          STATE_FILENAME: "state_swing.json"
          FX_PAIRS: "XAU/USD"
          TF_TREND: "4h"
          TF_STRUCTURE: "1h"            # SMC style uses 1H for structure/order-block, not 15M
          TF_ENTRY: "5min"
          TREND_CACHE_MINUTES: "230"
          STRUCTURE_CACHE_MINUTES: "50"  # under the 1h bar so a fresh fetch happens every bar
          SWING_LOOKBACK: "2"
          SL_BUFFER_ATR_MULT: "0.15"
          ENTRY_MODE: "structure"       # SMC: 1H order block/S&D zones + confluence, session-filtered
          OB_LOOKBACK: "15"
          OB_MAX_ZONES: "3"
          REJECTION_WICK_RATIO: "0.6"    # left as-is — script still ignores this value (unwired), see notes
          LIQUIDITY_LOOKBACK: "20"
          DISPLACEMENT_ATR_MULT: "1.0"
          SR_MIN_TOUCHES: "2"
          SR_TOUCH_TOLERANCE_ATR_MULT: "0.25"
          SD_CONSOLIDATION_BARS: "3"
          SD_MOVE_ATR_MULT: "1.5"
          SESSION_START_UTC: "7"        # London/NY combined window
          SESSION_END_UTC: "21"
          TP_MULTIPLES: "1,2,3,4,5"
          DAY_MAX_HOLD_HOURS: "24"       # hold-time nudge thresholds (one-time Telegram reminders)
          DAY_SWING_MAX_HOLD_HOURS: "72"
          SWING_MAX_HOLD_HOURS: "240"
          AUTO_TRADE_ENABLED: "false"
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          TRADE_LOT_SIZE: "0.01"
          MAX_CONCURRENT_TRADES: "1"
          BROKER_SYMBOL_SUFFIX: "m"
        run: python forex_alert.py
      - name: Commit updated state
        run: |
          git config user.name "forex-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_swing.json
          git diff --quiet --cached || git commit -m "Update swing signal state [skip ci]"
          git pull --rebase && git push
