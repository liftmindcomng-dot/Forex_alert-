name: Check forex signal

on:
  schedule:
    # Every 15 minutes. Note: GitHub's scheduler can lag by a few minutes
    # under load — fine for a 15min/1h strategy, not for scalping.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run signal check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRATEGY_LABEL: "SWING"
          FX_PAIRS: "XAU/USD"
          FX_INTERVAL: "15min"
          EMA_FAST: "5"
          EMA_SLOW: "10"
          RSI_OVERBOUGHT: "80"
          RSI_OVERSOLD: "20"
        run: python forex_alert.py

      - name: Commit updated state
        run: |
          git config user.name "forex-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update signal state [skip ci]"
          git push
