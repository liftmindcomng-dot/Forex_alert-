name: Check scalp signal

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scalp signal check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FX_PAIRS: "EUR/USD"
          FX_INTERVAL: "5min"
          EMA_FAST: "12"
          EMA_SLOW: "26"
          RSI_OVERBOUGHT: "60"
          RSI_OVERSOLD: "40"
          STATE_FILENAME: "state_scalp.json"
          STRATEGY_LABEL: "SCALP"
        run: python forex_alert.py

      - name: Commit updated state
        run: |
          git config user.name "forex-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_scalp.json
          git diff --quiet --cached || git commit -m "Update scalp state [skip ci]"
          git pull --rebase && git push
