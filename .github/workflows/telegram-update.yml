name: XAU/USD 🟢🔴 Market Update

on:
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:       # Manual run button

jobs:
  send-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance mplfinance pandas numpy matplotlib

      - name: Run the script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python raja_update.py
